name: Deploy main Branch to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_DEVELOP_HOST_IP }}
          username: minirag
          key: ${{ secrets.SSH_DEVELOP_PRIVATE_KEY }}
          script: |
            set -e  # Exit immediately if a command fails
            
            cd /home/minirag/workspace/mini-RAG
            
            # Fetch and ensure local branch matches remote 'main'
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            
            # Restart systemd service
            sudo systemctl restart minirag.service
            
            echo "Waiting for service initialization..."
            sleep 15

            # Health check loop
            PORT_READY=0
            for i in $(seq 1 6); do
              if ss -tuln | grep -q ':80'; then
                echo "✅ Port 80 is now active."
                PORT_READY=1
                break
              fi
              echo "⏳ Port 80 not ready yet (Attempt $i/6). Retrying in 5s..."
              sleep 5
            done

            if [ $PORT_READY -eq 0 ]; then
              echo "❌ Service failed to start on port 80"
              # Print logs for easier debugging in GitHub Actions console
              sudo journalctl -u minirag.service -n 50 --no-pager
              exit 1
            fi