name: Deploy main Branch to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy mini-RAG
        run: |
          set -e
          cd /home/minirag/workspace/mini-RAG
          
          # Sync local code with main branch
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          
          # Restart application
          sudo systemctl restart minirag.service
          
          echo "Waiting for service initialization..."
          sleep 15

          # Health check for port 80
          PORT_READY=0
          for i in $(seq 1 6); do
            if ss -tuln | grep -q ':80'; then
              echo "✅ Port 80 is active."
              PORT_READY=1
              break
            fi
            echo "⏳ Waiting for port 80... (Attempt $i/6)"
            sleep 5
          done

          if [ $PORT_READY -eq 0 ]; then
            echo "❌ Service failed to start on port 80"
            sudo journalctl -u minirag.service -n 50 --no-pager
            exit 1
          fi